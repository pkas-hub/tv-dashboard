<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060e1d;
    --panel: #0a1527;
    --line: rgba(150, 190, 255, 0.14);
    --text: #d9d3e3;
    --muted: #9a93aa;
    --accent: #ff3d7f;
    --accent-rgb: 255, 61, 127;
    --brillo: 0.8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  body { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; font-weight: 300; color: var(--text); }

  /* Diseñado para pantalla 4:3 (TV de tubo). Los márgenes dejan espacio para el overscan del tubo. */
  .stage {
    position: fixed; inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1.5fr) minmax(0, 0.55fr) minmax(0, 0.8fr);
    gap: 3vh 3.2vw;
    padding: 5.5vh 7vw;
    filter: brightness(var(--brillo));
    transition: transform 2s ease;
  }

  /* Reloj */
  .clock { grid-column: 1; grid-row: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0.8vh; }
  .clock svg { height: 100%; max-width: 100%; aspect-ratio: 1; }
  .tick { stroke: var(--text); stroke-width: 1.6; }
  .tick.major { stroke-width: 3.2; }
  .hand { stroke: var(--accent); stroke-linecap: round; }
  .hand.hour { stroke: var(--text); stroke-width: 4.4; }
  .hand.min { stroke: var(--text); stroke-width: 3; }
  .hand.sec { stroke-width: 1.6; }
  .date-label { fill: var(--text); font-size: 15px; letter-spacing: 0.1em; font-family: inherit; font-weight: 300; }

  /* Temperatura */
  .now { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding-left: 1.5vw; }
  .now .place { font-size: 3.4vh; color: var(--muted); }
  .now .cond { font-size: 4.4vh; color: var(--text); margin-top: 1.4vh; }
  .now .big { font-size: 23vh; font-weight: 200; line-height: 0.9; color: var(--accent); letter-spacing: -0.02em; margin-top: 1.8vh; }
  .now .hl { font-size: 4vh; color: var(--muted); display: flex; gap: 4.5vh; margin-top: 1.8vh; }

  /* Franja de datos */
  .strip {
    grid-column: 1 / 3; grid-row: 2;
    display: grid; grid-template-columns: repeat(3, 1fr); padding: 1.4vh 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 2vh;
  }
  .strip div { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .strip div + div { border-left: 1px solid var(--line); }
  .strip .l { font-size: 3.2vh; color: var(--muted); }
  .strip .v { font-size: 5.6vh; color: var(--text); margin-top: 1vh; }
  .strip .v.rain { color: var(--accent); }

  /* Fotos */
  .photos {
    grid-column: 1 / 3; grid-row: 3;
    position: relative; overflow: hidden; min-height: 0;
    border: 1px solid var(--line); border-radius: 3vh;
    background: radial-gradient(ellipse at 30% 20%, #130d22 0%, #08060f 75%);
  }
  .photos .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 4s ease;
    filter: grayscale(1) contrast(1.15) brightness(0.9);
  }
  .photos .slide.on { opacity: 1; }
  .photos .tint { display: none; position: absolute; inset: 0; background: var(--accent); mix-blend-mode: multiply; opacity: 0.85; pointer-events: none; }
  .photos.con-fotos:not(.sin-tinte) .tint { display: block; }
  .photos.sin-tinte .slide { filter: none; }
  .dots { position: absolute; right: 1.6vh; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 1.2vh; z-index: 2; }
  .dots span { width: 0.8vh; height: 0.8vh; border-radius: 50%; background: rgba(255,255,255,0.4); transition: all 0.5s; }
  .dots span.on { background: #fff; height: 2.4vh; border-radius: 1vh; }

  /* Fondo de luces violeta muy tenue: se ve mientras cargan las fotos o si no hay ninguna */
  .bokeh { position: absolute; inset: 0; overflow: hidden; }
  .bokeh i {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(115, 85, 195, 0.38), rgba(115, 85, 195, 0) 70%);
    filter: blur(0.5vh);
    animation: float 16s ease-in-out infinite alternate;
  }
  @keyframes float { from { transform: translate(0, 0) scale(1); opacity: 0.15; } to { transform: translate(3vh, -4vh) scale(1.25); opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .bokeh i { animation: none; opacity: 0.3; } }
</style>
</head>
<body>
<div class="stage" id="stage">

  <section class="clock">
    <svg viewBox="0 0 200 200" id="clock" aria-label="Reloj">
      <g id="ticks"></g>
      <text class="date-label" id="date" x="100" y="140" text-anchor="middle"></text>
      <line class="hand hour" id="h" x1="100" y1="100" x2="100" y2="58"/>
      <line class="hand min" id="m" x1="100" y1="100" x2="100" y2="34"/>
      <line class="hand sec" id="s" x1="100" y1="112" x2="100" y2="30"/>
      <circle cx="100" cy="100" r="3.4" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.6"/>
    </svg>
  </section>

  <section class="now">
    <div class="place" id="place">Cargando…</div>
    <div class="cond" id="cond">—</div>
    <div class="big" id="temp">—°</div>
    <div class="hl"><span id="hi">Máx —°</span><span id="lo">Mín —°</span></div>
  </section>

  <section class="strip">
    <div><span class="l">Lluvia esta noche</span><span class="v rain" id="rain">—</span></div>
    <div><span class="l">Amanecer</span><span class="v" id="sunrise">—</span></div>
    <div><span class="l">Atardecer</span><span class="v" id="sunset">—</span></div>
  </section>

  <section class="photos" id="photos">
    <div class="bokeh" id="bokeh"></div>
    <div class="tint"></div>
    <div class="dots" id="dots"></div>
  </section>

</div>

<script>
/* ================= CONFIGURACIÓN: lo único que tienes que tocar ================= */
const CONFIG = {
  lugar: "David, Chiriquí",
  lat: 8.4273,
  lon: -82.4308,
  zona: "America/Panama",

  // Color de acento (hex). Ejemplos: "#ff3d7f" rosa, "#ff2a2a" rojo, "#00e5ff" cian, "#7cff6b" verde
  acento: "#ff3d7f",

  // Brillo general de la pantalla: 1 = normal, 0.8 = tenue para cuarto oscuro, 0.6 = muy tenue
  brillo: 0.8,

  // Colores de fondo (azul oscuro atenuado). Ejemplos de fondo: "#060e1d" azul noche, "#05050a" casi negro
  fondo: "#060e1d",
  panel: "#0a1527",

  // FOTOS DESDE GOOGLE DRIVE: URL de tu Apps Script (termina en /exec).
  // Cada foto nueva que pongas en la carpeta aparece sola en la TV.
  driveScript: "https://script.google.com/macros/s/AKfycbyy6EhDqlsaVsnUx_m-Hs2oMcmjEZtY38HsnvNyeKsLy6fUAFZyAx6j_8rxNc2cUwATfA/exec",
  minutosActualizarFotos: 10,
  maxFotos: 50,        // máximo de fotos a mostrar (las más recientes)
  mezclar: false,      // true = orden aleatorio

  // Alternativa sin Drive: fotos en una carpeta "fotos" junto a este archivo, ej: ["fotos/1.jpg", "fotos/2.jpg"]
  fotos: [],

  // true = fotos teñidas con el color de acento (como en tu captura). false = fotos a color normal.
  tintarFotos: true,

  segundosPorFoto: 180,   // 3 minutos por foto
  minutosActualizarDatos: 15
};
/* ================================================================================= */

const $ = id => document.getElementById(id);

/* Colores y brillo */
(function () {
  const hex = CONFIG.acento.replace("#", "");
  const n = parseInt(hex.length === 3 ? hex.split("").map(c => c + c).join("") : hex, 16);
  const root = document.documentElement.style;
  root.setProperty("--accent", CONFIG.acento);
  root.setProperty("--accent-rgb", [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(", "));
  root.setProperty("--bg", CONFIG.fondo);
  root.setProperty("--panel", CONFIG.panel);
  root.setProperty("--brillo", CONFIG.brillo);
})();

$("place").textContent = CONFIG.lugar;

/* Reloj analógico */
(function buildTicks() {
  let out = "";
  for (let i = 0; i < 60; i += 5) {
    const a = (i * 6 - 90) * Math.PI / 180;
    const major = i % 15 === 0;
    const r1 = 94, r2 = major ? 80 : 85;
    out += `<line class="tick${major ? " major" : ""}" x1="${100 + r1 * Math.cos(a)}" y1="${100 + r1 * Math.sin(a)}" x2="${100 + r2 * Math.cos(a)}" y2="${100 + r2 * Math.sin(a)}"/>`;
  }
  $("ticks").innerHTML = out;
})();

function tickClock() {
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: CONFIG.zona }));
  const s = now.getSeconds(), m = now.getMinutes(), h = now.getHours() % 12;
  $("s").setAttribute("transform", `rotate(${s * 6} 100 100)`);
  $("m").setAttribute("transform", `rotate(${m * 6 + s * 0.1} 100 100)`);
  $("h").setAttribute("transform", `rotate(${h * 30 + m * 0.5} 100 100)`);
  $("date").textContent = new Intl.DateTimeFormat("es-PA", { weekday: "short", day: "numeric", timeZone: CONFIG.zona })
    .format(new Date()).replace(".", "").toUpperCase();
}
tickClock();
setInterval(tickClock, 1000);

/* Clima (Open-Meteo: datos de modelos meteorológicos para tus coordenadas, gratis y sin API key) */
const WMO = {
  0: "Despejado", 1: "Mayormente despejado", 2: "Parcialmente nublado", 3: "Nublado",
  45: "Neblina", 48: "Neblina", 51: "Llovizna ligera", 53: "Llovizna", 55: "Llovizna fuerte",
  61: "Lluvia ligera", 63: "Lluvia", 65: "Lluvia fuerte", 80: "Chubascos ligeros", 81: "Chubascos", 82: "Chubascos fuertes",
  95: "Tormenta eléctrica", 96: "Tormenta con granizo", 99: "Tormenta con granizo"
};
function hora12(iso) {
  const [h, m] = iso.split("T")[1].split(":").map(Number);
  return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "pm" : "am"}`;
}

async function cargarClima() {
  try {
    const url = "https://api.open-meteo.com/v1/forecast"
      + `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
      + "&current=temperature_2m,weather_code"
      + "&hourly=precipitation_probability"
      + "&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset"
      + `&timezone=${encodeURIComponent(CONFIG.zona)}&forecast_days=1`;
    const r = await (await fetch(url)).json();
    $("temp").textContent = Math.round(r.current.temperature_2m) + "°";
    $("cond").textContent = WMO[r.current.weather_code] || "—";
    $("hi").textContent = "Máx " + Math.round(r.daily.temperature_2m_max[0]) + "°";
    $("lo").textContent = "Mín " + Math.round(r.daily.temperature_2m_min[0]) + "°";
    $("sunrise").textContent = hora12(r.daily.sunrise[0]);
    $("sunset").textContent = hora12(r.daily.sunset[0]);
    const hoy = r.daily.time[0];
    const noche = r.hourly.time
      .map((t, i) => ({ t, p: r.hourly.precipitation_probability[i] }))
      .filter(x => x.t.startsWith(hoy) && Number(x.t.slice(11, 13)) >= 18)
      .map(x => x.p);
    $("rain").textContent = (noche.length ? Math.max(...noche) : 0) + "%";
  } catch (e) { console.warn("Clima no disponible", e); }
}
cargarClima();
setInterval(cargarClima, CONFIG.minutosActualizarDatos * 60 * 1000);

/* Fotos (Google Drive y/o carpeta local) */
(function fotos() {
  const cont = $("photos"), dots = $("dots"), bokeh = $("bokeh");
  if (!CONFIG.tintarFotos) cont.classList.add("sin-tinte");

  for (let i = 0; i < 18; i++) {
    const el = document.createElement("i");
    const size = 8 + Math.random() * 18;
    el.style.cssText = `width:${size}vh;height:${size}vh;left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:-${Math.random() * 16}s;animation-duration:${12 + Math.random() * 10}s`;
    bokeh.appendChild(el);
  }
  dots.style.display = "none";

  let lista = [], slides = [], puntos = [], idx = 0, timer = null;

  const urlDrive = id => `https://lh3.googleusercontent.com/d/${id}=w1920`;
  const precargar = src => new Promise(res => {
    const im = new Image();
    im.onload = () => res(src);
    im.onerror = () => { console.warn("No se pudo cargar", src); res(null); };
    im.src = src;
  });

  function mostrar(n) {
    slides.forEach((s, k) => s.classList.toggle("on", k === n));
    puntos.forEach((p, k) => p.classList.toggle("on", k === n));
  }

  function reconstruir(nueva) {
    slides.forEach(s => s.remove());
    dots.innerHTML = "";
    lista = nueva;
    slides = lista.map(src => {
      const d = document.createElement("div");
      d.className = "slide";
      d.style.backgroundImage = `url("${src}")`;
      cont.insertBefore(d, cont.querySelector(".tint"));
      return d;
    });
    puntos = lista.map(() => { const s = document.createElement("span"); dots.appendChild(s); return s; });
    bokeh.style.display = "none";
    cont.classList.add("con-fotos");
    dots.style.display = lista.length > 1 ? "flex" : "none";
    idx = 0;
    mostrar(0);
    clearInterval(timer);
    if (lista.length > 1) timer = setInterval(() => { idx = (idx + 1) % lista.length; mostrar(idx); }, CONFIG.segundosPorFoto * 1000);
  }

  async function actualizar(fuentes) {
    let f = fuentes.slice(0, CONFIG.maxFotos);
    if (CONFIG.mezclar) f = f.sort(() => Math.random() - 0.5);
    const ok = (await Promise.all(f.map(precargar))).filter(Boolean);
    if (!ok.length) return;
    if (!CONFIG.mezclar && ok.join("|") === lista.join("|")) return;
    reconstruir(ok);
  }

  async function cargarDrive() {
    try {
      const r = await (await fetch(CONFIG.driveScript)).json();
      await actualizar((r.ids || []).map(urlDrive));
    } catch (e) { console.warn("Drive no disponible", e); }
  }

  if (CONFIG.driveScript) {
    cargarDrive();
    setInterval(cargarDrive, CONFIG.minutosActualizarFotos * 60 * 1000);
  } else if (CONFIG.fotos.length) {
    actualizar(CONFIG.fotos);
  }
})();

/* Protección de pantalla: mueve todo unos píxeles cada 5 minutos para evitar marcas en el tubo */
setInterval(() => {
  const dx = (Math.random() * 8 - 4).toFixed(1), dy = (Math.random() * 8 - 4).toFixed(1);
  $("stage").style.transform = `translate(${dx}px, ${dy}px)`;
}, 5 * 60 * 1000);
</script>
</body>
</html>
